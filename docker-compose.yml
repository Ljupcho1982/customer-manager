services:
  postgres:
    image: postgres:16-alpine
    container_name: blazor-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: customermanagement
    ports:
      - "5432:5432"
    volumes:
      - blazor-pgdata:/var/lib/postgresql/data

volumes:
  blazor-pgdata:
