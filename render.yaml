databases:
  - name: customer-manager-db
    plan: free
    databaseName: customermanager
    user: customermanager
    ipAllowList: []   # private connections only

services:
  - type: web
    name: customer-manager
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: customer-manager-db
          property: connectionString
      # SendGrid — set these in the Render dashboard ("Environment" tab) after first deploy.
      - key: SendGrid__ApiKey
        sync: false
      - key: SendGrid__FromAddress
        sync: false
      - key: SendGrid__FromName
        sync: false
